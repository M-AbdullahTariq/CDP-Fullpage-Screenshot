<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        margin: 0;
        padding: 16px;
      }
      #header {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      #title {
        flex: 1;
        font-size: 14px;
        font-weight: 700;
        color: #202124;
      }
      button {
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #1a73e8;
        color: #fff;
      }
      #gear {
        flex: none;
        width: 42px;
        padding: 8px 0;
        font-size: 16px;
        background: #f1f3f4;
        color: #444;
      }
      #gear:hover {
        background: #e2e5e9;
      }
      #modes {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #modes[hidden] {
        display: none;
      }
      .mode {
        width: 100%;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mode .soon {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        opacity: 0.85;
      }
      #stop {
        width: 100%;
        background: #c5221f;
      }
      #stop[hidden] {
        display: none;
      }
      button:disabled {
        background: #9ab;
        cursor: default;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 16px;
        word-break: break-word;
      }
      #footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #e8eaed;
        font-size: 12px;
      }
      #historyLink {
        color: #1a73e8;
        text-decoration: none;
        cursor: pointer;
      }
      #historyLink:hover {
        text-decoration: underline;
      }
      .ok { color: #137333; }
      .err { color: #c5221f; }
    </style>
  </head>
  <body>
    <div id="header">
      <span id="title">Capture as PDF</span>
      <button id="gear" type="button" title="Settings" aria-label="Settings">⚙</button>
    </div>

    <div id="modes">
      <button class="mode" data-mode="entire">Entire page</button>
      <button class="mode" data-mode="visible">Visible part</button>
      <button class="mode" data-mode="selection">Selection</button>
      <button class="mode" data-mode="all-tabs">All tabs</button>
      <button class="mode" data-mode="batch">Batch (URL list)…</button>
    </div>

    <button id="stop" type="button" hidden>Stop</button>

    <div id="status"></div>

    <div id="footer">
      <a id="historyLink" href="#">📁 View capture history</a>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
